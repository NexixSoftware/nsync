[package]
name = "nsync"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.8", features=["derive"] }
dotenvy = "0.15.7"
rust-s3 = "0.38.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
